<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0c0c0d" />
  
  <!-- Outer Border Frame -->
  <rect x="12" y="12" width="76" height="76" fill="none" stroke="#ffffff" stroke-width="3" />
  
  <!-- Inner Thin Border Accent -->
  <rect x="16" y="16" width="68" height="68" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  
  <!-- S Letter -->
  <text x="32" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">S</text>
  
  <!-- Divider Bar -->
  <line x1="50" y1="28" x2="50" y2="72" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- E Letter -->
  <text x="68" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">E</text>
</svg>
